name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Cancel in-flight runs for the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI only reads repository contents. Grant nothing else to the job token.
permissions:
  contents: read

jobs:
  android:
    name: Android — build + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android licenses + install platform 36
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" >/dev/null

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      # The model + AAR are gitignored (>100 MB) and fetched on demand. Cache
      # them by the download script's own hash so a version bump invalidates.
      - name: Cache large dependencies (model + AAR)
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: |
            android/app/src/main/assets/sherpa-whisper-base
            android/local-repo
          key: deps-sherpa-base-${{ hashFiles('scripts/download-dependencies.sh') }}

      - name: Download large dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: ./scripts/download-dependencies.sh

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Build + run all unit tests
        run: |
          cd android
          ./gradlew :app:assembleDebug \
                   :keyboard-ime:testDebugUnitTest \
                   :transliteration:testDebugUnitTest \
                   :voice-capture:testDebugUnitTest \
                   :speech:testDebugUnitTest \
                   :speech-ondevice:testDebugUnitTest \
                   --console=plain --stacktrace

      # Debug APKs are for development only. User-facing, update-compatible
      # builds are signed and published by release.yml from version tags.
      - name: Upload development APKs
        uses: actions/upload-artifact@v4
        with:
          name: shohojakkhor-keyboard-development-debug-apks-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build outputs (APK + test reports) on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-outputs-${{ github.run_id }}
          path: |
            android/app/build/outputs/apk
            android/**/build/test-results
            android/**/build/reports
          if-no-files-found: ignore
          retention-days: 7

  backend:
    name: Backend — pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend deps
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run backend tests
        run: |
          cd backend
          pytest -q
