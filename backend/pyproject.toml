[project]
name = "shobdo-backend"
version = "0.1.0"
description = "Shobdo Keyboard backend — speech-to-text proxy for an elderly-friendly Bengali IME."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "All Rights Reserved" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "openai>=1.40.0",
    "python-multipart>=0.0.12",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
