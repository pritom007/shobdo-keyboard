# Render Blueprint for the backend only. Android files are never built or deployed.
# Secret values are generated by Render or entered directly in the Render dashboard.
services:
  - type: web
    name: shohojakkhor-keyboard-backend
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 30
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: SHOHOJAKKHOR_SHARED_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: ""
      - key: MAX_AUDIO_BYTES
        value: "2097152"
      - key: MAX_AUDIO_SECONDS
        value: "60"
      - key: RATE_LIMIT_PER_MINUTE
        value: "20"
      - key: RATE_LIMIT_MAX_CLIENTS
        value: "10000"
      - key: PROVIDER_TIMEOUT_MS
        value: "20000"
